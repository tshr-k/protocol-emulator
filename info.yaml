# Tiny Tapeout project information
project:
  title:        "Protocol Emulator" # Project title
  author:       "tshr-k"            # Your name
  discord:      ""                  # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A reprogrammable protocol emulator ASIC" # One line description of what your project does
  language:     "SystemVerilog" # Verilog, SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     48000000        # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tshr_k_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_tshr_k_protocol_emulator.sv"
    - "protocol_emulator.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "HOST_SPI_SCK"
  ui[1]: "HOST_SPI_CS_n"
  ui[2]: "HOST_SPI_MOSI"
  ui[3]: "PPS"
  ui[4]: "ENGINE_P8"
  ui[5]: "ENGINE_P9"
  ui[6]: "ENGINE_P10"
  ui[7]: "ENGINE_P11"

  # Outputs
  uo[0]: "HOST_SPI_MISO"
  uo[1]: "HOST_IRQ"
  uo[2]: "TRIG"
  uo[3]: "PPS_OUT"
  uo[4]: "ENGINE_P12"
  uo[5]: "ENGINE_P13"
  uo[6]: "ENGINE_P14"
  uo[7]: "ENGINE_P15"

  # Bidirectional pins
  uio[0]: "ENGINE_P0"
  uio[1]: "ENGINE_P1"
  uio[2]: "ENGINE_P2"
  uio[3]: "ENGINE_P3"
  uio[4]: "ENGINE_P4"
  uio[5]: "ENGINE_P5"
  uio[6]: "ENGINE_P6"
  uio[7]: "ENGINE_P7"

# Do not change!
yaml_version: 6
